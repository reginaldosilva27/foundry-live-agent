<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon-foundry-live-agent-azul.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Vendored from the Dataside Design System, verbatim. Linked from `public/` rather than
      imported through the bundler so the copy needs no local edit (constitution §4).
      See public/ds/README.md.
    -->
    <link rel="stylesheet" href="/ds/colors_and_type.css" />
    <title>Foundry Live Agent</title>
    <!--
      The theme, before first paint (spec 036, AC3/AC12).

      CSS cannot read storage, so there is no CSS-only way to honour a CHOSEN theme on the first
      frame; without this the app paints the other palette and corrects itself, on every load.

      It necessarily spells the key before any module exists to ask, so `fla.theme.v1` appears here
      and in `state/storage.ts`. That duplication is deliberate and `preferences.test.ts` asserts
      the two agree. Nothing stored paints light, the default (spec 060); `system` writes no
      attribute, which lets the stylesheet's `prefers-color-scheme` block take over.
    -->
    <script>
      try {
        var t = localStorage.getItem('fla.theme.v1')
        if (t) t = JSON.parse(t)
        if (t !== 'system') document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light')
      } catch (e) {
        /* A blocked origin or a private window: light, the default (spec 060). */
        document.documentElement.setAttribute('data-theme', 'light')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
