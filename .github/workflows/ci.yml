name: CI

# Mirror of the local quality gates (constitution §3). One job per architecture layer
# (backend · ai · frontend · infra). Each job auto-skips while its layer has no code yet,
# and activates as soon as the project adds a manifest. Keep this in lockstep with the
# `verify-gates` skill, `.codex/prompts/verify-gates.md`, the `justfile`, and the
# constitution's *Quality gates* — those four mirror each other (§4).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── backend/ — Python (FastAPI BFF) ─────────────────────────────────────────
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Lint, format & test (Python)
        run: |
          if [ ! -f requirements.txt ] && [ ! -f pyproject.toml ]; then
            echo "::notice::backend/ not set up yet — skipping."; exit 0
          fi
          [ -f requirements.txt ] && pip install -r requirements.txt
          ruff check .
          ruff format --check .
          # Integration tests that hit real Foundry are gated by RUN_INTEGRATION_TESTS
          # and stay off in CI until a federated-credential login is configured (§5).
          pytest -q

  # ── ai/ — Python (harnesses, agent definitions, tools) ──────────────────────
  ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Lint & test (Python)
        run: |
          if [ ! -f requirements.txt ] && [ ! -f pyproject.toml ]; then
            echo "::notice::ai/ not set up yet — skipping."; exit 0
          fi
          [ -f requirements.txt ] && pip install -r requirements.txt
          ruff check .
          # Contract tests replay recorded fixtures — no Azure credential needed.
          pytest -q

  # ── frontend/ — React + TypeScript + Vite ───────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # vitest 5 needs >=22.12; vite 8 needs >=20.19. Pinned to the LTS that satisfies both.
          node-version: "24"
      - name: Lint, test & build (React/TS)
        run: |
          if [ ! -f package.json ]; then
            echo "::notice::frontend/ not set up yet — skipping."; exit 0
          fi
          npm ci
          npm run lint
          npm test
          npm run build

  # ── infra/ — Bicep + azd (NOT Terraform — see constitution amendment table) ──
  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - name: Build & lint (Bicep)
        run: |
          if [ ! -f main.bicep ]; then
            echo "::notice::infra/ not set up yet — skipping."; exit 0
          fi
          az bicep install
          az bicep build --file main.bicep
          az bicep lint --file main.bicep
