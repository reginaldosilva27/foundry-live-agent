name: CI

# Mirror of the local quality gates (constitution §3). One job per architecture layer
# (backend · ai · frontend · infra), plus the hosted graph's own job and a cross-layer security
# job (amended 2026-10-15). Each layer job auto-skips while its layer has no code yet,
# and activates as soon as the project adds a manifest. Keep this in lockstep with the
# `verify-gates` skill, `.codex/prompts/verify-gates.md`, the `justfile`, and the
# constitution's *Quality gates* — those four mirror each other (§4).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── backend/ — Python (FastAPI BFF) ─────────────────────────────────────────
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Lint, format & test (Python)
        run: |
          if [ ! -f requirements.txt ] && [ ! -f pyproject.toml ]; then
            echo "::notice::backend/ not set up yet — skipping."; exit 0
          fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # The BFF imports the harness contract and the tools from ai/ rather than duplicating
          # them (§4), and `pythonpath` in pyproject.toml says so — so ai/ has to be installed here
          # too, or the import that proves §4 is what breaks CI.
          if [ -f ../ai/pyproject.toml ]; then pip install -e ../ai; fi
          if [ -f pyproject.toml ]; then pip install -e ".[dev]"; fi
          ruff check .
          ruff format --check .
          # Integration tests that hit real Foundry are gated by RUN_INTEGRATION_TESTS
          # and stay off in CI until a federated-credential login is configured (§5).
          pytest -q

  # ── ai/ — Python (harnesses, agent definitions, tools) ──────────────────────
  ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Lint & test (Python)
        run: |
          if [ ! -f requirements.txt ] && [ ! -f pyproject.toml ]; then
            echo "::notice::ai/ not set up yet — skipping."; exit 0
          fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # `.[dev]` and not `.[azure]` or `.[hosted]`: the contract tests replay recorded fixtures
          # and need no credential, and the hosted-graph tests skip with a reason that says why
          # rather than silently passing (§5). Installing more would hide that skip.
          if [ -f pyproject.toml ]; then pip install -e ".[dev]"; fi
          ruff check .
          # Contract tests replay recorded fixtures — no Azure credential needed.
          pytest -q

  # ── ai/ hosted graph — the LangGraph container's tests (spec 018) ───────────
  # The job above keeps its skip honest; this one makes the skipped tests RUN. Separate, so the
  # `ai` job still proves the contract suite needs no LangGraph, and so a hosted break is named.
  ai-hosted:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Hosted graph tests (Python)
        run: |
          pip install -e ".[dev,hosted]"
          # Fails here, loudly, rather than letting `importorskip` turn a missing extra into a skip.
          python -c "import langgraph, langchain_core, langchain_mcp_adapters"
          pytest -q -rs tests/test_hosted_graph.py tests/test_hosted_host.py

  # ── frontend/ — React + TypeScript + Vite ───────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # vitest 5 needs >=22.12; vite 8 needs >=20.19. Pinned to the LTS that satisfies both.
          node-version: "24"
      - name: Lint, test & build (React/TS)
        run: |
          if [ ! -f package.json ]; then
            echo "::notice::frontend/ not set up yet — skipping."; exit 0
          fi
          npm ci
          npm run lint
          npm test
          npm run build
      # End-to-end smoke (amended 2026-10-15): the real app in a real browser, against the demo
      # entrypoint — recorded Foundry turns, no credential. It needs the BFF, hence Python here.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: End-to-end smoke (Playwright, demo replay)
        run: |
          pip install -e ../ai -e ../backend
          npx playwright install --with-deps chromium
          npm run e2e

  # ── security — dependencies and secrets, across every layer ─────────────────
  # Amended 2026-10-15: the assessment found a signed URL in a fixture that no gate looked for, and
  # known-vulnerable dependencies that no gate reported. Dependabot proposes updates; this fails.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans the history, not just the tree
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Python dependencies (pip-audit)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -e ./ai -e ./backend
          # The two local packages are not on PyPI; everything they pull in is audited.
          pip-audit --skip-editable
      - name: Frontend dependencies (npm audit)
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Secrets in the history (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          # Reviewed false positives live in .gitleaksignore, by fingerprint.
          ./gitleaks git --no-banner --redact .

  # ── infra/ — Bicep + azd (NOT Terraform — see constitution amendment table) ──
  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - name: Build & lint (Bicep)
        run: |
          if [ ! -f main.bicep ]; then
            echo "::notice::infra/ not set up yet — skipping."; exit 0
          fi
          az bicep install
          az bicep build --file main.bicep
          az bicep lint --file main.bicep
