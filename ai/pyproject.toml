[project]
name = "foundry-live-agent-ai"
version = "0.1.0"
description = "Agent harnesses, agent definitions and client-side tools for foundry-live-agent"
requires-python = ">=3.12"
# httpx backs the `search_web` tool's one POST. It is already a backend/ dependency; the
# tools live here, so the declaration belongs here too.
dependencies = ["PyYAML>=6", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]
# Only needed to RUN apply_agent.py / spike.py against Azure. Tests replay fixtures and
# never import these, which keeps CI free of credentials.
azure = ["azure-ai-projects>=2.3.0", "azure-identity>=1.19", "openai>=1.60"]
# The hosted agent's graph (spec 018). The container installs from
# harness/langgraph/agent/requirements.txt, which is what actually ships; this group exists so the
# graph tests can RUN locally. Where it is absent they skip with a reason that says why, rather
# than silently passing (ai/tests/test_hosted_graph.py).
hosted = ["langgraph>=1.0", "langchain-core>=0.3", "langchain-mcp-adapters>=0.1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
