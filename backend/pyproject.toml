[project]
name = "foundry-live-agent-backend"
version = "0.1.0"
description = "The BFF for foundry-live-agent: identity, streaming, tool execution, traces"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "azure-ai-projects>=2.3.0",
    "azure-identity>=1.19",
    "openai>=1.60",
    # The Speech REST call (spec 008). It arrived as a transitive dependency of `openai`; a runtime
    # import deserves to be declared.
    "httpx>=0.27",
    # The Voice Live control channel. One small dependency, and the alternative — a hand-rolled
    # WebSocket client — is exactly the kind of thing that looks fine until a close frame arrives.
    "websockets>=13",
    # Reading the agent's spans back out of Application Insights (spec 005). `LogsQueryClient`
    # only; `MetricsClient` moved to its own package at 2.0.0. Imported lazily in app/traces.py, so
    # a deployment that configures no tracing never loads it.
    "azure-monitor-query>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The harness contract and tools live in ai/; the BFF imports them rather than duplicating (§4).
pythonpath = [".", "../ai"]
